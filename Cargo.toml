[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.8"
edition = "2021"
publish = false

[workspace.dependencies]
mika-audio = { path = "crates/mika-audio" }
mika-core = { path = "crates/mika-core" }
mika-providers = { path = "crates/mika-providers" }
mika-tools = { path = "crates/mika-tools" }

async-trait = "0.1"
futures = "0.3"
keyring = { version = "3", features = ["windows-native"] }
log = "0.4"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "process", "io-util", "net"] }
tokio-util = "0.7"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Control",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechRecognition",
    "Media_SpeechSynthesis",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
base64 = "0.22"
cpal = "0.18"
windows-collections = "0.3"
sha2 = "0.10"
png = "0.17"
flate2 = "1"
ring = "0.17"
arboard = { version = "3", default-features = false }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
